<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Inscription</title>
</head>
<body>
  <h1>Test d'inscription sans JavaScript</h1>
  
  <!-- Remplacez l'URL par la vôtre -->
  <form action="https://script.google.com/macros/s/AKfycbyCFQq8PNkIpaZimtcXkprx4cWSD8uc-kUnx6gufb0emDjGbOAtNlsHMGcUUGXviioRBw/exec" method="POST">
    
    <!-- Champs cachés pour dire à Apps Script quoi faire -->
    <input type="hidden" name="action" value="inscription">
    
    <label>Nom :</label><br>
    <input type="text" name="nom" required><br><br>
    
    <label>Email :</label><br>
    <input type="email" name="email" required><br><br>
    
    <button type="submit">S'abonner (Test)</button>
  </form>
</body>
</html>
